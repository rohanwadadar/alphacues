# Alpha Cues local infrastructure (backend + Flutter mobile/web clients).
# Mobile apps connect to API at host.docker.internal or localhost — no extra mobile services here.
# Push (FCM/APNs) and store signing are configured in Firebase / Apple / Google consoles.

services:
  postgres:
    image: postgres:16-alpine
    container_name: alphacues-postgres
    environment:
      POSTGRES_USER: alphacues
      POSTGRES_PASSWORD: alphacues
      POSTGRES_DB: alphacues
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphacues -d alphacues"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: alphacues-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    container_name: alphacues-mailpit
    profiles:
      - mail
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  redisdata:
