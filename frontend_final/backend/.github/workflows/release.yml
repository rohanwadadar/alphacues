name: Release Gate & Security Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety trufflehog

      - name: Run Bandit Security Linter
        run: |
          bandit -r backend/app -x backend/tests --exit-zero

      - name: Secrets Leakage Scan
        run: |
          echo "Scanning for accidental hardcoded secrets in repository..."
          ! grep -rE "AIzaSy[A-Za-z0-9_-]{33}|AKIA[0-9A-Z]{16}" . --exclude-dir={.git,.venv,node_modules,build}

  backend-test:
    name: Backend Test Suite
    needs: security-audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alphacues
          POSTGRES_PASSWORD: alphacues
          POSTGRES_DB: alphacues
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Pytest Security & Integration Suite
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg://alphacues:alphacues@localhost:5432/alphacues
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
        run: |
          cd backend
          pytest -v

  release-gate-pass:
    name: Release Gate Gatekeeper
    needs: [security-audit, backend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Log Release Success
        run: |
          echo "Release gate passed successfully. System is verified secure and ready for deployment."
