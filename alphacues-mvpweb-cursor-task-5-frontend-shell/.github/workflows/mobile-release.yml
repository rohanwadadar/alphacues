# Required secrets:
# ANDROID_KEYSTORE_BASE64    — base64-encoded .jks keystore
# ANDROID_KEY_ALIAS          — key alias within the keystore
# ANDROID_KEY_PASSWORD       — key password
# ANDROID_STORE_PASSWORD     — keystore-level store password (may equal key password)
# PLAY_SERVICE_ACCOUNT_JSON  — GCP service account JSON for Play API
# IOS_DIST_CERT_P12          — base64-encoded iOS distribution certificate (.p12)
# IOS_DIST_CERT_PASSWORD     — password for the .p12 distribution certificate
# IOS_PROVISION_PROFILE      — base64-encoded .mobileprovision file
# APP_STORE_CONNECT_API_KEY  — App Store Connect API key JSON
# FIREBASE_SERVICE_ACCOUNT_JSON — (consumed by backend worker for FCM; documented here for team reference)

name: Mobile Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  mobile-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --set-exit-if-changed .
      - run: flutter test

  android-build:
    runs-on: ubuntu-latest
    needs: mobile-analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Android SDK Platform 36
        uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36"
      - run: flutter pub get
      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
      - name: Configure release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/upload-keystore.jks
          EOF
      - run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: frontend/build/debug-info/android

  ios-build:
    runs-on: macos-latest
    needs: mobile-analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd ios && pod install
      - name: Import iOS distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          echo "$IOS_DIST_CERT_P12" | base64 --decode > /tmp/dist-cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/dist-cert.p12 -k build.keychain -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          echo "$IOS_PROVISION_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - run: |
          flutter build ipa --release \
            --obfuscate \
            --split-debug-info=build/debug-info/ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: frontend/build/ios/ipa/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-debug-symbols
          path: frontend/build/debug-info/ios

  android-submit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: artifacts/android
      - name: Upload to Play internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-service-account.json
          echo "Upload AAB from artifacts/android to Play internal track (wire fastlane beta_android)."
          echo "Service account: /tmp/play-service-account.json"

  ios-submit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/ios
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY" > /tmp/app-store-connect-api-key.json
          echo "Upload IPA from artifacts/ios to TestFlight (wire fastlane beta_ios)."
          echo "API key: /tmp/app-store-connect-api-key.json"
